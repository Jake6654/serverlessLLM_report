experiment:
  name: traffic-aware-serverless-llm
  random_seed: 42
  repetitions: 3

model:
  name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  revision: main
  dtype: bfloat16
  max_model_len: 2048
  gpu_memory_utilization: 0.9
  max_num_seqs: 16
  kv_cache_dtype: auto

server:
  host: 127.0.0.1
  port: 8000
  startup_timeout_seconds: 180
  request_timeout_seconds: 240
  readiness_poll_interval_seconds: 1.0

request:
  endpoint: /v1/completions
  prompt: "Explain serverless computing in one sentence."
  max_tokens: 32
  temperature: 0.0
  stream: true

monitoring:
  gpu_sample_interval_ms: 200

workload:
  type: steady
  request_interval_seconds: 5.0
  total_requests: 20
  concurrency: 1

policies:
  fixed_keep_warm:
    timeout_seconds: 30
    timeout_candidates_seconds: [10, 30, 60]

  rule_based:
    alpha: 0.3
    timeout_multiplier: 2.0
    minimum_timeout_seconds: 10
    maximum_timeout_seconds: 120

  ml_based:
    model_type: logistic_regression
    prediction_horizon_seconds: 30
    decision_threshold: 0.5

metrics:
  ttft_slo_seconds: 1.0
  gpu_active_memory_threshold_mib: 100

output:
  results_directory: results
