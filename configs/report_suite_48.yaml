# Completed report experiment: 4 workloads x 3 policies x 4 repetitions.
suite:
  name: traffic-aware-serverless-llm-report-48-v1
  repetitions: 4
  random_seed: 42
  policies:
    - always_on
    - naive_serverless
    - fixed_keep_warm

base_config: experiment.yaml

workloads:
  # Requests arrive much faster than the 30-second keep-warm timeout.
  - name: dense-5s
    request_interval_seconds: 5.0
    total_requests: 20

  # Boundary workloads reveal behavior around the 30-second timeout.
  - name: boundary-25s
    request_interval_seconds: 25.0
    total_requests: 8

  - name: boundary-35s
    request_interval_seconds: 35.0
    total_requests: 8

  # Requests arrive far beyond the keep-warm timeout.
  - name: sparse-90s
    request_interval_seconds: 90.0
    total_requests: 6
